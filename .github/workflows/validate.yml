              git clone "$DOTFILES_REPO" "$update_clone"
              git -C "$update_clone" config user.name ci
              git -C "$update_clone" config user.email ci@example.invalid
              printf "\n%s\n" "$UPDATE_MARKER" >> "$update_clone/home/dot_fdignore"
              git -C "$update_clone" add home/dot_fdignore
              git -c commit.gpgsign=false -C "$update_clone" commit -m "CI update fixture"
              git -C "$update_clone" push origin HEAD:refs/heads/main
            '

          sudo -u dotfilesci -H env HOME=/home/dotfilesci USER=dotfilesci \
            PATH="/home/dotfilesci/.local/bin:$PATH" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" DOTFILES_NONINTERACTIVE=1 DOTFILES_CORE_ONLY=1 \
            bash -lc 'bash "$GITHUB_WORKSPACE/update.sh" --core-only'

          sudo -u dotfilesci -H env HOME=/home/dotfilesci USER=dotfilesci \
            PATH="/home/dotfilesci/.local/bin:$PATH" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" UPDATE_MARKER="$marker" \
            bash -lc 'grep -Fqx "$UPDATE_MARKER" "$HOME/.fdignore"; bash "$GITHUB_WORKSPACE/tests/linux/assert-state.sh" arch'

  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Provision WinGet if the hosted runner lacks it
        shell: pwsh
        run: |
          Write-Host 'Checking for winget.exe'
          cmd /c where winget.exe
          if ($LASTEXITCODE -ne 0) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
            Import-Module Microsoft.WinGet.Client -Force
            Repair-WinGetPackageManager -Force -Latest
          }
          cmd /c where winget.exe
          if ($LASTEXITCODE -ne 0) { throw 'winget.exe is unavailable after Microsoft.WinGet.Client repair' }
          winget.exe --version
          @(
            (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Microsoft.PowerShell'),
            (Join-Path $env:LOCALAPPDATA 'Programs\mise'),
            (Join-Path $env:LOCALAPPDATA 'Programs\chezmoi')
          ) | ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ }

      - name: Create the exact-commit local bootstrap remote
        shell: pwsh
        run: |
          $remote = Join-Path $env:RUNNER_TEMP "dotfiles-remote-$env:GITHUB_RUN_ID.git"
          git init --bare $remote
          $head = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "checkout $head does not match GITHUB_SHA $env:GITHUB_SHA" }
          $remoteUri = "file:///" + $remote.Replace('\', '/')
          git -C $env:GITHUB_WORKSPACE push $remoteUri "$($env:GITHUB_SHA):refs/heads/main"
          if ($LASTEXITCODE -ne 0) { throw "unable to push the checked-out commit to $remoteUri" }
          git --git-dir=$remote show-ref --verify --quiet refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'local bootstrap remote has no main ref' }
          git --git-dir=$remote symbolic-ref HEAD refs/heads/main
          Add-Content -Path $env:GITHUB_ENV -Value "DOTFILES_REPO=$remoteUri"
          Write-Host "Local bootstrap remote: $remoteUri"

      - name: Confirm normal execution policy
        shell: pwsh
        run: |
          Get-ExecutionPolicy -List | Format-Table -AutoSize
          if ((Get-ExecutionPolicy) -eq 'AllSigned') { throw 'normal Windows job unexpectedly has AllSigned effective' }

      - name: Smoke-test PowerShell bridge under normal policy
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'bridge-smoke.ps1'
          @'
          param([string]$Value)
          if ($Value -ne 'bridge-ok') { throw "unexpected bridge value: $Value" }
          '@ | Set-Content -LiteralPath $smoke
          & "$env:GITHUB_WORKSPACE\scripts\windows\invoke-ps-script.cmd" $smoke -Value bridge-ok
          if ($LASTEXITCODE -ne 0) { throw "PowerShell bridge smoke test failed with exit code $LASTEXITCODE" }

      - name: Ensure Windows bootstrap core tools
        shell: pwsh
        run: |
          $packages = @(
            @{ Id = 'Git.Git'; Command = 'git.exe' },
            @{ Id = 'Microsoft.PowerShell'; Command = 'pwsh.exe' },
            @{ Id = 'jdx.mise'; Command = 'mise.exe' },
            @{ Id = 'twpayne.chezmoi'; Command = 'chezmoi.exe' }
          )
          foreach ($package in $packages) {
            cmd /c "where $($package.Command) >nul 2>&1"
            if ($LASTEXITCODE -ne 0) {
              winget.exe install --id $package.Id --exact --source winget --scope user --silent --disable-interactivity --accept-source-agreements --accept-package-agreements
              if ($LASTEXITCODE -ne 0) { throw "unable to install $($package.Id) for current user" }
            }
          }
          @(
            (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Microsoft.PowerShell'),
            (Join-Path $env:LOCALAPPDATA 'Programs\mise'),
            (Join-Path $env:LOCALAPPDATA 'Programs\chezmoi')
          ) | ForEach-Object {
            if ($env:Path -notlike "*$_*") { $env:Path += ";$_" }
            Add-Content -Path $env:GITHUB_PATH -Value $_
          }
          foreach ($command in @('git.exe','pwsh.exe','mise.exe','chezmoi.exe')) {
            cmd /c "where $command"
            if ($LASTEXITCODE -ne 0) { throw "$command is unavailable after provisioning" }
          }

      - name: Initialize chezmoi from the exact-commit remote
        shell: pwsh
        run: |
          $runDirectory = Join-Path $env:RUNNER_TEMP 'dotfiles-run'
          New-Item -ItemType Directory -Path $runDirectory -Force | Out-Null
          Push-Location $runDirectory
          try {
            chezmoi.exe init --apply $env:DOTFILES_REPO
            if ($LASTEXITCODE -ne 0) { throw "chezmoi init --apply failed with exit code $LASTEXITCODE" }
            $source = (& chezmoi.exe source-path).Trim()
            if (-not (Test-Path -LiteralPath $source)) { throw "chezmoi source path does not exist: $source" }
          }
          finally { Pop-Location }

      - name: Provision Starship for the core PowerShell profile
        shell: pwsh
        run: |
          mise.exe use -g starship@latest
          if ($LASTEXITCODE -ne 0) { throw "mise could not provision starship" }

      - name: Provision managed PowerShell modules
        shell: pwsh
        run: |
          $modules = Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\scripts\windows\managed-modules.txt" |
            Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') }
          foreach ($module in $modules) {
            if (-not (Get-Module -ListAvailable -Name $module | Select-Object -First 1)) {
              Install-Module -Name $module -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -AcceptLicense -Confirm:$false
            }
            if (-not (Get-Module -ListAvailable -Name $module | Select-Object -First 1)) {
              throw "managed PowerShell module was not provisioned: $module"
            }
          }

      - name: Smoke-test module signing helper under normal policy
        shell: pwsh
        run: |
          $helper = "$env:GITHUB_WORKSPACE\scripts\windows\signing.ps1"
          $bridge = "$env:GITHUB_WORKSPACE\scripts\windows\invoke-ps-script.cmd"
          $modules = Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\scripts\windows\managed-modules.txt" |
            Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') }
          foreach ($module in $modules) {
            & $bridge $helper -Action ProtectModule -ModuleName $module
            if ($LASTEXITCODE -ne 0) { throw "signing helper failed for $module under normal policy" }
          }

      - name: Run Windows core installer through the bridge
        shell: pwsh
        env:
          DOTFILES_NONINTERACTIVE: '1'
          DOTFILES_CORE_ONLY: '1'
        run: |
          $source = (& chezmoi.exe source-path).Trim()
          $repoRoot = if (Test-Path -LiteralPath (Join-Path $source 'install.ps1')) {
            $source
          }
          elseif (Test-Path -LiteralPath (Join-Path (Split-Path -Parent $source) 'install.ps1')) {
            Split-Path -Parent $source
          }
          else {
            throw "unable to resolve repository root from chezmoi source path: $source"
          }
          & (Join-Path $repoRoot 'scripts\windows\invoke-ps-script.cmd') (Join-Path $repoRoot 'install.ps1') -NonInteractive -CoreOnly -RepoRoot $repoRoot
          if ($LASTEXITCODE -ne 0) { throw "core installer failed with exit code $LASTEXITCODE" }

      - name: Run Windows bootstrap wrapper idempotently
        shell: pwsh
        env:
          DOTFILES_NONINTERACTIVE: '1'
          DOTFILES_CORE_ONLY: '1'
        run: |
          $runDirectory = Join-Path $env:RUNNER_TEMP 'dotfiles-run'
          Push-Location $runDirectory
          try {
            $bootstrap = Join-Path $env:GITHUB_WORKSPACE 'bootstrap.cmd'
            & cmd.exe /d /c $bootstrap
            if ($LASTEXITCODE -ne 0) { throw "bootstrap.cmd failed with exit code $LASTEXITCODE" }
          }
          finally { Pop-Location }

      - name: Assert Windows normal-policy state
        shell: pwsh
        run: |
          & pwsh.exe -NoProfile -File "$env:GITHUB_WORKSPACE\tests\windows\assert-state.ps1" `
            -RepoRoot $env:GITHUB_WORKSPACE -ExpectedCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise update.cmd against the local remote
        shell: pwsh
        env:
          DOTFILES_NONINTERACTIVE: '1'
          DOTFILES_CORE_ONLY: '1'
        run: |
          $updateClone = Join-Path $env:RUNNER_TEMP 'dotfiles-update'
          git clone $env:DOTFILES_REPO $updateClone
          git -C $updateClone config user.name ci
          git -C $updateClone config user.email ci@example.invalid
          $marker = "ci-update-marker-$env:GITHUB_RUN_ID"
          Add-Content -Path (Join-Path $updateClone 'home\dot_fdignore') -Value $marker
          git -C $updateClone add home/dot_fdignore
          git -c commit.gpgsign=false -C $updateClone commit -m 'CI update fixture'
          git -C $updateClone push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'unable to push Windows update fixture' }

          $runDirectory = Join-Path $env:RUNNER_TEMP 'dotfiles-run'
          Push-Location $runDirectory
          try {
            $update = Join-Path $env:GITHUB_WORKSPACE 'update.cmd'
            & cmd.exe /d /c $update
            if ($LASTEXITCODE -ne 0) { throw "update.cmd failed with exit code $LASTEXITCODE" }
          }
          finally { Pop-Location }

          & pwsh.exe -NoProfile -File "$env:GITHUB_WORKSPACE\tests\windows\assert-state.ps1" `
            -RepoRoot $env:GITHUB_WORKSPACE -UpdateMarker $marker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-allsigned:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Provision WinGet before changing execution policy
        shell: pwsh
        run: |
          Write-Host 'Checking for winget.exe'
          cmd /c where winget.exe
          if ($LASTEXITCODE -ne 0) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
            Import-Module Microsoft.WinGet.Client -Force
            Repair-WinGetPackageManager -Force -Latest
          }
          cmd /c where winget.exe
          if ($LASTEXITCODE -ne 0) { throw 'winget.exe is unavailable after Microsoft.WinGet.Client repair' }
          winget.exe --version
          @(
            (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Microsoft.PowerShell'),
            (Join-Path $env:LOCALAPPDATA 'Programs\mise'),
            (Join-Path $env:LOCALAPPDATA 'Programs\chezmoi')
          ) | ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ }

      - name: Create the exact-commit local bootstrap remote before AllSigned
        shell: pwsh
        run: |
          $remote = Join-Path $env:RUNNER_TEMP "dotfiles-remote-$env:GITHUB_RUN_ID.git"
          git init --bare $remote
          $head = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "checkout $head does not match GITHUB_SHA $env:GITHUB_SHA" }
          $remoteUri = "file:///" + $remote.Replace('\', '/')
          git -C $env:GITHUB_WORKSPACE push $remoteUri "$($env:GITHUB_SHA):refs/heads/main"
          if ($LASTEXITCODE -ne 0) { throw "unable to push the checked-out commit to $remoteUri" }
          git --git-dir=$remote show-ref --verify --quiet refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'local bootstrap remote has no main ref' }
          git --git-dir=$remote symbolic-ref HEAD refs/heads/main
          Add-Content -Path $env:GITHUB_ENV -Value "DOTFILES_REPO=$remoteUri"
          Write-Host "Local bootstrap remote: $remoteUri"

      - name: Create CI code-signing certificate
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'allsigned-bridge-smoke.ps1'
          @'
          param([string]$Value)
          if ($Value -ne 'bridge-ok') { throw "unexpected bridge value: $Value" }
          '@ | Set-Content -LiteralPath $smoke

          $subject = 'CN=jsilverdev Dotfiles Code Signing'
          $certificate = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -eq $subject -and $_.HasPrivateKey -and $_.NotAfter -gt (Get-Date) } |
            Sort-Object NotAfter -Descending |
            Select-Object -First 1
          if ($null -eq $certificate) {
            $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(10) -HashAlgorithm SHA256
          }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dotfiles-cert-thumbprint.txt') -Value $certificate.Thumbprint -NoNewline
          Export-Certificate -Cert $certificate -FilePath (Join-Path $env:RUNNER_TEMP 'dotfiles-signing.cer') -Type CERT -Force | Out-Null

      - name: Trust CI code-signing certificate for current user
        id: trust_certificate
        continue-on-error: true
        shell: cmd
        timeout-minutes: 1
        run: |
          certutil.exe -user -f -addstore TrustedPublisher "%RUNNER_TEMP%\dotfiles-signing.cer"
          if errorlevel 1 exit /b 1
          certutil.exe -user -f -addstore Root "%RUNNER_TEMP%\dotfiles-signing.cer"
          if errorlevel 1 exit /b 1

      - name: Validate AllSigned prerequisites when Root trust is unavailable
        if: steps.trust_certificate.outcome != 'success'
        shell: pwsh
        run: |
          $thumbprint = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dotfiles-cert-thumbprint.txt') -Raw).Trim()
          $certificate = Get-ChildItem Cert:\CurrentUser\My | Where-Object Thumbprint -eq $thumbprint | Select-Object -First 1
          if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
            throw 'CI code-signing certificate is unavailable'
          }

          $smoke = Join-Path $env:RUNNER_TEMP 'allsigned-bridge-smoke.ps1'
          $signed = Set-AuthenticodeSignature -FilePath $smoke -Certificate $certificate -HashAlgorithm SHA256
          $signature = Get-AuthenticodeSignature -FilePath $smoke
          if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $thumbprint) {
            throw "AuthentiCode signing did not use the expected certificate: $($signed.Status)"
          }

          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy AllSigned -Force
          try {
            $currentUser = Get-ExecutionPolicy -Scope CurrentUser
            $effective = Get-ExecutionPolicy
            if ($currentUser -ne 'AllSigned' -or $effective -ne 'AllSigned') {
              throw "unable to establish CurrentUser AllSigned: CurrentUser=$currentUser Effective=$effective"
            }
            Write-Warning 'Hosted runner blocked non-interactive CurrentUser Root trust. Full trusted-publisher execution is skipped; certificate creation, Authenticode signing, and AllSigned policy persistence were validated.'
          }
          finally {
            Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Undefined -Force
          }

      - name: Enable and prove CurrentUser AllSigned
        if: steps.trust_certificate.outcome == 'success'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy AllSigned -Force
          $currentUser = Get-ExecutionPolicy -Scope CurrentUser
          $effective = Get-ExecutionPolicy
          Get-ExecutionPolicy -List | Format-Table -AutoSize
          Write-Host "CurrentUser=$currentUser Effective=$effective"
          if ($currentUser -ne 'AllSigned' -or $effective -ne 'AllSigned') {
            throw "unable to establish effective CurrentUser AllSigned: CurrentUser=$currentUser Effective=$effective"
          }

      - name: Smoke-test signing bridge under AllSigned
        if: steps.trust_certificate.outcome == 'success'
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\scripts\windows\invoke-ps-script.cmd" "%RUNNER_TEMP%\allsigned-bridge-smoke.ps1" -Value bridge-ok
          if errorlevel 1 exit /b 1

      - name: Run the real bootstrap through CMD and the signing bridge
        if: steps.trust_certificate.outcome == 'success'
        shell: cmd
        env:
          DOTFILES_NONINTERACTIVE: '1'
          DOTFILES_CORE_ONLY: '1'
        run: |
          set "RUN_DIRECTORY=%RUNNER_TEMP%\dotfiles-run"
          if not exist "%RUN_DIRECTORY%" mkdir "%RUN_DIRECTORY%"
          pushd "%RUN_DIRECTORY%"
          call "%GITHUB_WORKSPACE%\bootstrap.cmd"
          if errorlevel 1 exit /b 1
          popd

      - name: Assert signed runtime and module state through the bridge
        if: steps.trust_certificate.outcome == 'success'
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\scripts\windows\invoke-ps-script.cmd" "%GITHUB_WORKSPACE%\tests\windows\assert-allsigned.ps1" -RepoRoot "%GITHUB_WORKSPACE%" -ThumbprintFile "%RUNNER_TEMP%\dotfiles-cert-thumbprint.txt"
          if errorlevel 1 exit /b 1

      - name: Create an update commit without changing the Actions checkout
        if: steps.trust_certificate.outcome == 'success'
        shell: cmd
        run: |
          set "UPDATE_CLONE=%RUNNER_TEMP%\dotfiles-update"
          git clone "%DOTFILES_REPO%" "%UPDATE_CLONE%"
          if errorlevel 1 exit /b 1
          git -C "%UPDATE_CLONE%" config user.name ci
          git -C "%UPDATE_CLONE%" config user.email ci@example.invalid
          set "UPDATE_MARKER=ci-update-marker-%GITHUB_RUN_ID%"
          >>"%UPDATE_CLONE%\home\dot_fdignore" echo %UPDATE_MARKER%
          git -C "%UPDATE_CLONE%" add home/dot_fdignore
          git -c commit.gpgsign=false -C "%UPDATE_CLONE%" commit -m "CI update fixture"
          git -C "%UPDATE_CLONE%" push origin HEAD:refs/heads/main
          if errorlevel 1 exit /b 1
          echo UPDATE_MARKER=%UPDATE_MARKER%>>"%GITHUB_ENV%"

      - name: Exercise update.cmd and recheck AllSigned idempotency
        if: steps.trust_certificate.outcome == 'success'
        shell: cmd
        env:
          DOTFILES_NONINTERACTIVE: '1'
          DOTFILES_CORE_ONLY: '1'
        run: |
          call "%GITHUB_WORKSPACE%\update.cmd"
          if errorlevel 1 exit /b 1
          call "%GITHUB_WORKSPACE%\scripts\windows\invoke-ps-script.cmd" "%GITHUB_WORKSPACE%\tests\windows\assert-allsigned.ps1" -RepoRoot "%GITHUB_WORKSPACE%" -ThumbprintFile "%RUNNER_TEMP%\dotfiles-cert-thumbprint.txt" -UpdateMarker "%UPDATE_MARKER%"
          if errorlevel 1 exit /b 1
