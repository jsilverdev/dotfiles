name: Validate dotfiles

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install static-validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3 ruby shellcheck
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsLS https://get.chezmoi.io | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate shell, source state, templates, and architecture
        shell: bash
        run: |
          set -euo pipefail
          bash -n bootstrap.sh install.sh update.sh tests/linux/assert-state.sh
          shellcheck -x -S error bootstrap.sh install.sh update.sh tests/linux/assert-state.sh
          chezmoi --source "$GITHUB_WORKSPACE" managed >/dev/null
          while IFS= read -r -d '' template; do
            chezmoi --source "$GITHUB_WORKSPACE" execute-template < "$template" >/dev/null
          done < <(find "$GITHUB_WORKSPACE" -type f -name '*.tmpl' -print0)

          test "$(tr -d '\r\n' < .chezmoiroot)" = home
          test -d home
          test -f scripts/windows/invoke-ps-script.cmd
          test -f scripts/windows/invoke-ps-script-bridge.ps1
          test -f scripts/windows/signing.ps1
          test -f scripts/windows/deploy-pwsh.ps1
          test -f scripts/windows/managed-modules.txt
          test -f home/.chezmoiscripts/run_after_90-deploy-pwsh.cmd.tmpl

          if git ls-files | grep -E '(^|/)symlink_[^/]*$'; then
            echo 'chezmoi symlink source state is not allowed' >&2
            exit 1
          fi
          if git grep -n -i 'dotbot' -- ':!.github/workflows/validate.yml'; then
            echo 'obsolete Dotbot dependency/reference found' >&2
            exit 1
          fi
          if git grep -n -E 'https://github\.com/jsilverdev/dotfiles\.git.*master|raw\.githubusercontent\.com/jsilverdev/dotfiles/master'; then
            echo 'obsolete master bootstrap URL found' >&2
            exit 1
          fi
          if git grep -n -E 'Set-ExecutionPolicy|-ExecutionPolicy[[:space:]]+Bypass' -- ':!\.github/workflows/validate.yml'; then
            echo 'production execution-policy weakening found' >&2
            exit 1
          fi
          if git grep -n -E 'PowerShellCore\\ShellIds|Software\\Microsoft\\PowerShell\\1\\ShellIds' -- '*.ps1' '*.psm1' '*.cmd'; then
            echo 'implementation-specific PowerShell execution-policy registry probing found' >&2
            exit 1
          fi
          if git grep -n '^# SIG # Begin signature block' -- '*.ps1' '*.psm1'; then
            echo 'signed PowerShell source was committed' >&2
            exit 1
          fi

      - name: Validate encoded PowerShell bridge source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import pathlib
          import re

          cmd = pathlib.Path('scripts/windows/invoke-ps-script.cmd').read_text(encoding='utf-8')
          source = pathlib.Path('scripts/windows/invoke-ps-script-bridge.ps1').read_text(encoding='utf-8')
          match = re.search(r'(?m)^pwsh\.exe -NoProfile -EncodedCommand ([A-Za-z0-9+/=]+)\s*$', cmd)
          if not match:
              raise SystemExit('encoded bridge payload is missing')
          decoded = base64.b64decode(match.group(1)).decode('utf-16le')
          if decoded != source:
              raise SystemExit('encoded bridge payload does not match invoke-ps-script-bridge.ps1')
          if len(match.group(1)) >= 8000:
              raise SystemExit('encoded bridge payload is too close to cmd.exe command-line limits')
          print(f'bridge-source-ok: encoded length={len(match.group(1))}')
          PY

      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' .github/workflows/validate.yml
          echo 'workflow-yaml-ok'

      - name: Validate PowerShell syntax
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -Command - <<'PWSH'
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          $errors = @()
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) {
              $joined = $parseErrors -join '; '
              $errors += "$($_.FullName): $joined"
            }
          }
          if ($errors.Count) {
            $errors | Write-Error
            exit 1
          }
          PWSH
          echo 'powershell-syntax-ok'

  linux-debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:bookworm-slim
    steps:
      - name: Prepare Debian container for checkout
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git sudo bash

      - name: Check out the exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Debian bootstrap as an unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

          remote_parent="$(mktemp -d)"
          remote_dir="$remote_parent/dotfiles.git"
          git init --bare "$remote_dir"
          git -C "$GITHUB_WORKSPACE" push "$remote_dir" "$GITHUB_SHA:refs/heads/main"
          git --git-dir="$remote_dir" symbolic-ref HEAD refs/heads/main
          chmod -R a+rX "$GITHUB_WORKSPACE"

          useradd --create-home --shell /bin/bash dotfilesci
          printf 'dotfilesci ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/dotfilesci
          chmod 0440 /etc/sudoers.d/dotfilesci
          chown -R dotfilesci:dotfilesci "$remote_parent"
          echo "DOTFILES_REPO=file://$remote_dir" >> "$GITHUB_ENV"
          sudo -u dotfilesci -H env HOME=/home/dotfilesci USER=dotfilesci \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            DOTFILES_REPO="file://$remote_dir" DOTFILES_NONINTERACTIVE=1 DOTFILES_CORE_ONLY=1 \
            bash -lc 'cd /tmp; bash "$GITHUB_WORKSPACE/bootstrap.sh"'
          sudo -u dotfilesci -H env HOME=/home/dotfilesci USER=dotfilesci \
            PATH="/home/dotfilesci/.local/bin:$PATH" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" EXPECTED_COMMIT="$GITHUB_SHA" \
            bash -lc 'bash "$GITHUB_WORKSPACE/tests/linux/assert-state.sh" debian "$EXPECTED_COMMIT"'

      - name: Exercise Debian update wrapper against the local remote
        shell: bash
        run: |
          set -euo pipefail
          marker="ci-update-marker-${GITHUB_RUN_ID}"

          sudo -u dotfilesci -H env HOME=/home/dotfilesci USER=dotfilesci \
            DOTFILES_REPO="$DOTFILES_REPO" UPDATE_MARKER="$marker" \
            bash -lc '
              set -euo pipefail
              update_parent="$(mktemp -d)"
              update_clone="$update_parent/dotfiles-update"
              git clone "$DOTFILES_REPO" "$update_clone"
              git -C "$update_clone" config user.name ci
              git -C "$update_clone" config user.email ci@example.invalid
              printf "\n%s\n" "$UPDATE_MARKER" >> "$update_clone/home/dot_fdignore"
              git -C "$update_clone" add home/dot_fdignore
              git -c commit.gpgsign=false -C "$update_clone" commit -m "CI update fixture"
              git -C "$update_clone" push origin HEAD:refs/heads/main
            '

          sudo -u dotfilesci -H env HOME=/home/dotfilesci USER=dotfilesci \
            PATH="/home/dotfilesci/.local/bin:$PATH" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" DOTFILES_NONINTERACTIVE=1 DOTFILES_CORE_ONLY=1 \
            bash -lc 'bash "$GITHUB_WORKSPACE/update.sh" --core-only'

          sudo -u dotfilesci -H env HOME=/home/dotfilesci USER=dotfilesci \
            PATH="/home/dotfilesci/.local/bin:$PATH" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" UPDATE_MARKER="$marker" \
            bash -lc 'grep -Fqx "$UPDATE_MARKER" "$HOME/.fdignore"; bash "$GITHUB_WORKSPACE/tests/linux/assert-state.sh" debian'

  linux-arch:
